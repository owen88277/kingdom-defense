<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="王國防線"><meta name="theme-color" content="#2b1d14"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>王國防線</title>
<style>
html,body{height:100%;margin:0;background:#2b1d14;color:#f1e2c0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.ld{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px;box-sizing:border-box}
.ld h1{margin:0;font:900 clamp(30px,7vw,52px)/1.1 "Noto Serif TC","Songti TC",serif;color:#e8b84a;letter-spacing:.08em;text-shadow:0 3px 0 #000}
.bar{width:min(420px,80vw);height:22px;border-radius:12px;background:#140c06;border:3px solid #5a3e28;box-shadow:inset 0 2px 4px #000;overflow:hidden}
.fill{height:100%;width:0;border-radius:9px;background:linear-gradient(#ffd76a,#e8962a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:width .15s}
.pct{font:700 16px/1 sans-serif;color:#c7b38f;min-height:1em}
</style>
<div class="ld"><h1>王國防線</h1><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">載入中… 0%</div></div>
<script>
(function(){
var URL_='game.html?v=e022609634',SIZE=1441245,fill=document.getElementById('fill'),pct=document.getElementById('pct');
function show(p,t){fill.style.width=(p*100).toFixed(1)+'%';pct.textContent=t||('載入中… '+Math.floor(p*100)+'%');}
function go(){location.replace(URL_);}
function run(html){show(1,'準備戰場…');setTimeout(function(){document.open();document.write(html);document.close();},30);}
if(!window.fetch||!window.TextDecoder||!window.ReadableStream){go();return;}
fetch(URL_).then(function(r){
  if(!r.ok)throw 0;
  if(!r.body||!r.body.getReader)return r.text().then(run);
  var rd=r.body.getReader(),parts=[],got=0;
  function pump(){return rd.read().then(function(x){
    if(x.done){var all=new Uint8Array(got),o=0;for(var i=0;i<parts.length;i++){all.set(parts[i],o);o+=parts[i].length;}run(new TextDecoder('utf-8').decode(all));return;}
    parts.push(x.value);got+=x.value.length;show(Math.min(.99,got/SIZE));return pump();});}
  return pump();
}).catch(go);
})();
</script>
</html>
