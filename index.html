<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="王國防線"><meta name="theme-color" content="#2b1d14"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>王國防線</title>
<style>
/* Layout: one canvas battlefield sized to fit the screen, HUD and tooltip float on top of the map. Single dark look by choice. */
:root{
  --wood:#2b1d14; --wood-2:#3d2a1c; --plank:#5a3e28; --gold:#e8b84a; --parch:#f1e2c0;
  --ink:#f6ecd6; --muted:#c7b38f; --blood:#c4472f; --mana:#7d5cff;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--wood);color:var(--ink);font-family:var(--body);padding-inline:8px;padding-block:8px;box-sizing:border-box;overflow:hidden}
.game{position:relative;box-sizing:border-box;margin:0 auto;border:3px solid var(--plank);border-radius:12px;overflow:hidden;background:#4d6b33;--u:1;--fs:clamp(11px,calc(var(--u)*15px),15px);font-size:var(--fs)}
.game.fs{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;border-radius:0;border-width:0}
.game.fs.rot{transform:translate(-50%,-50%) rotate(90deg)}
.fsbg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#5fa82e,#2f6418);z-index:9}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:20;max-width:min(92vw,420px);background:rgba(24,18,12,.94);color:#f6ecd6;border:2px solid #c99a3e;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:4px;align-items:flex-start;padding:max(4px,calc(var(--u)*7px));pointer-events:none}
.hud>*{pointer-events:auto}
.stats{display:flex;gap:4px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:.3em;background:rgba(24,18,12,.8);border:1.5px solid #c99a3e;border-radius:999px;padding:.05em .65em .05em .25em;font-weight:900;font-size:max(10px,calc(var(--u)*14px));color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.pill svg{width:1.35em;height:1.35em;flex:none}
.btns{margin-left:auto;display:flex;gap:4px}
button{font-family:var(--body);font-weight:900;font-size:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sq{width:max(26px,calc(var(--u)*32px));height:max(26px,calc(var(--u)*32px));font-size:max(10px,calc(var(--u)*13px));display:grid;place-items:center;padding:0;color:#fff;background:linear-gradient(#5b86ad,#3c6189);border:2px solid #1d2c3c;border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.4)}
.sq svg{width:62%;height:62%}
.sq.on{background:linear-gradient(#f0c44a,#c99a2a);color:#2a1a0e}
#btnSound .mute,#btnSound.off .wave{display:none}#btnSound.off .mute{display:inline}
#btnFs .close,#btnFs.on .open{display:none}#btnFs.on .close{display:inline}
#btnPause .go,#btnPause.on .pz{display:none}#btnPause.on .go{display:inline}
.skills{position:absolute;left:max(5px,calc(var(--u)*8px));bottom:max(8px,calc(var(--u)*12px));display:grid;grid-template-columns:auto auto;gap:max(9px,calc(var(--u)*12px)) max(6px,calc(var(--u)*9px));font-size:max(9px,calc(var(--u)*12px))}
.skill{position:relative;width:max(32px,calc(var(--u)*44px));height:max(32px,calc(var(--u)*44px));padding:0;border-radius:50%;border:2px solid #d9b25c;background:#222;overflow:visible;box-shadow:0 0 0 2px #1d140e,0 3px 0 2px rgba(0,0,0,.45)}
.skill svg{width:100%;height:100%;border-radius:50%;display:block}
.skill:disabled{cursor:default}
.skill:disabled svg{filter:grayscale(.7) brightness(.7)}
.skill.on{border-color:#9fe8ff;box-shadow:0 0 0 2px #1d140e,0 0 14px 3px rgba(159,232,255,.8)}
.skill .cdmask{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:0 0 999px 999px;background:rgba(10,10,20,.55);pointer-events:none}
.skill .cap,.skill .lv{position:absolute;left:50%;transform:translateX(-50%);bottom:-.7em;background:#1d140e;color:#ffe08a;border:1.5px solid #d9b25c;border-radius:999px;font-size:.75em;line-height:1.3;padding:0 .55em;white-space:nowrap}
.skill .lv{top:-.5em;bottom:auto;left:auto;right:-.4em;transform:none;color:#9fe8ff;padding:0 .45em}
.skill .hpbar{position:absolute;left:12%;right:12%;bottom:-.45em;height:.38em;background:#1d140e;border-radius:9px;overflow:hidden;border:1px solid #1d140e}
.skill .hpbar i{display:block;height:100%;width:100%;background:#4fd1ff}
.wavebtn{display:flex;align-items:center;gap:.35em;height:max(24px,calc(var(--u)*28px));padding:0 .7em 0 .15em;border-radius:999px;border:1.5px solid #ffb04a;background:linear-gradient(#d9542f,#a8341c);color:#fff;font-size:max(10px,calc(var(--u)*14px));white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.wavebtn svg{height:85%;width:auto;aspect-ratio:1;border-radius:50%;flex:none}
.wavebtn:disabled{filter:grayscale(.5) brightness(.8);cursor:default}
.wavebtn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #1d140e,0 0 14px 4px rgba(255,140,60,.9)}}
.tip{position:absolute;left:50%;transform:translateX(-50%);max-width:70%;width:max-content;pointer-events:none;background:rgba(24,18,12,.9);border:2px solid #c99a3e;border-radius:10px;padding:calc(var(--fs)*.35) calc(var(--fs)*.7);line-height:1.45;color:#e9dcc0;top:calc(var(--fs)*3.2)}
.tip.low{top:auto;bottom:calc(var(--fs)*.6);left:auto;right:calc(var(--fs)*.6);transform:none;max-width:55%}
.tip b{color:#fff}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,6,.72);padding:16px;overflow:auto}
.card{margin:auto;background:var(--parch);color:var(--wood);border:4px solid #8a6634;border-radius:14px;padding:22px 26px;max-width:460px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,48px);margin:0;letter-spacing:.08em;color:#6b2a14;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.6}
.card ul{margin:0;padding-left:1.2em;text-align:left;font-size:13px;line-height:1.7}
.card button{background:#6b2a14;color:var(--parch);border-color:#3f170a;font-size:16px;padding:10px 18px;align-self:center}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .row button.alt{background:#2e5d8a;border-color:#1b3a57}
.card .row button.lvb{background:#b9a27a;border-color:#8a6634;color:#3a2412;font-size:14px;padding:6px 12px}
.card .row button.lvb.on{background:#2f7d2e;border-color:#1c4d1b;color:#fff}
@media (max-width:640px),(max-height:520px){.overlay{padding:8px}.card{padding:12px 14px;gap:8px}.card ul,.card p.long{display:none}.card h1{font-size:26px}.card button{padding:8px 16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(()=>{
const W=960,H=600;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
// web fonts load in the background so a slow font host never blocks the game
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap';document.head.appendChild(l);}catch(e){}

// ---------- audio (all synthesized with Web Audio) ----------
const AU={c:null,on:true,last:{},battle:false,step:0,next:0};
try{AU.on=localStorage.getItem('td-sound')!=='off';}catch(e){}
function auInit(){
  if(AU.c){if(AU.c.state!=='running')AU.c.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const c=new C();AU.c=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
  AU.master=c.createGain();AU.master.gain.value=AU.on?.85:0;AU.master.connect(comp);
  const len=Math.floor(c.sampleRate*2.4),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
  const rev=c.createConvolver();rev.buffer=ir;const rg=c.createGain();rg.gain.value=.32;rev.connect(rg);rg.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.75;AU.sfx.connect(AU.master);
  AU.sfxRev=c.createGain();AU.sfxRev.gain.value=.5;AU.sfx.connect(AU.sfxRev);AU.sfxRev.connect(rev);
  AU.mus=c.createGain();AU.mus.gain.value=.3;AU.mus.connect(AU.master);
  const mr=c.createGain();mr.gain.value=.9;AU.mus.connect(mr);mr.connect(rev);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  AU.next=c.currentTime+.1;setInterval(musicTick,25);
}
function setSound(on){AU.on=on;try{localStorage.setItem('td-sound',on?'on':'off');}catch(e){}
  if(AU.master)AU.master.gain.setTargetAtTime(on?.85:0,AU.c.currentTime,.05);}
function tone(f,t,dur,o={}){
  const c=AU.c,osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+(o.glide||dur));
  if(o.detune)osc.detune.value=o.detune;
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*.012;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.05);}
  const v=o.vol??.3,a=o.attack??.005;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
  if(o.sustain){g.gain.setValueAtTime(v,t+dur*o.sustain);}
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=osc;
  if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.lp,t);if(o.lpTo)fl.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur);fl.Q.value=o.q||1;osc.connect(fl);node=fl;}
  node.connect(g);g.connect(o.dest||AU.sfx);osc.start(t);osc.stop(t+dur+.02);
}
function noise(t,dur,o={}){
  const c=AU.c,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;s.loop=true;f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||1000,t);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||.7;
  const v=o.vol??.3,a=o.attack??.003;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(o.dest||AU.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
const N=n=>440*Math.pow(2,(n-69)/12);
const GAP={arrow:.05,magic:.07,cannon:.08,boom:.06,clang:.09,death:.05,coin:.06,hit:.04};
function sfx(name,arg){
  if(!AU.c||!AU.on||AU.c.state!=='running')return;
  const now=AU.c.currentTime;
  if(GAP[name]&&now-(AU.last[name]||0)<GAP[name])return;AU.last[name]=now;
  const t=now+.01,r=(a,b)=>a+Math.random()*(b-a);
  switch(name){
  case 'arrow':
    noise(t,.09,{ft:'bandpass',f:r(2600,3400),to:900,q:2,vol:.22});
    tone(r(700,820),t,.07,{type:'triangle',to:300,vol:.08});break;
  case 'magic':{
    const b=r(0,2);
    [76,83,88,95].forEach((n,i)=>tone(N(n+b),t+i*.035,.35,{type:'sine',vol:.09,vib:7}));
    tone(N(64),t,.35,{type:'sawtooth',lp:2400,lpTo:400,vol:.08});
    noise(t,.3,{ft:'highpass',f:6000,vol:.05});break;}
  case 'magicHit':tone(N(91),t,.25,{type:'sine',to:N(103),vol:.07});noise(t,.15,{ft:'bandpass',f:5000,q:4,vol:.06});break;
  case 'cannon':
    tone(140,t,.35,{type:'sine',to:38,vol:.55});
    noise(t,.3,{f:1400,to:120,vol:.45});
    noise(t+.02,.12,{ft:'highpass',f:2000,vol:.12});break;

function mkRoute(pts){const sg=[];let tot=0;for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const len=Math.hypot(b[0]-a[0],b[1]-a[1]);sg.push({a,b,len,start:tot});tot+=len;}return{pts,segs:sg,total:tot};}
function at(d,R){
  R=R||ROUTES[0];const sg=R.segs;
  d=Math.max(0,Math.min(R.total-0.001,d));
  let s=sg[0];for(const g of sg){if(d>=g.start)s=g;else break;}
  const t=(d-s.start)/s.len;
  return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,ang:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};
}
function nearestD(x,y){let best=1e9,bd=0;for(let d=0;d<TOTAL;d+=4){const p=at(d);const q=Math.hypot(p.x-x,p.y-y);if(q<best&&p.x>10&&p.x<W-10){best=q;bd=d;}}return bd;}

function heroGainXp(h,n){

function updateHero(dt){
  const h=S.hero;if(!h)return;
  if(h.dead){h.respawn-=dt;if(h.respawn<=0){h.dead=false;h.hp=HERO.hp[h.lvl];h.x=HERO_SPAWN.x;h.y=HERO_SPAWN.y;h.guard={...HERO_SPAWN};h.cmd=null;
    S.fx.push({k:'ring',x:h.x,y:h.y,t:0,life:.6,col:'#9fe8ff'});}return;}
  const L=h.lvl,max=HERO.hp[L];
  h.skill=Math.max(0,h.skill-dt);h.swing=Math.max(0,h.swing-dt);h.mv=Math.max(0,(h.mv||0)-dt);h.spin=Math.max(0,h.spin-dt);
  if(h.cmd){
    const dx=h.cmd.x-h.x,dy=h.cmd.y-h.y,dd=Math.hypot(dx,dy);
    if(dd<3){h.guard={x:h.cmd.x,y:h.cmd.y};h.cmd=null;}
    else{const v=Math.min(dd,HERO.spd*dt);h.x+=dx/dd*v;h.y+=dy/dd*v;h.walk+=dt*12;h.mv=.12;if(Math.abs(dx)>1)h.face=dx>0?1:-1;}
    return;
  }
  if(h.target&&(h.target.dead||dist(h.target,h.guard)>HERO.guard+40))releaseTarget(h);
  if(!h.target){
    let free=null,fd=1e9,best=null,bd=1e9;
    for(const e of S.enemies){if(e.dead||e.D.flying||e.D.naval)continue;const d=dist(e,h.guard);if(d>HERO.guard)continue;
      if(!e.blocker&&d<fd){fd=d;free=e;}if(d<bd){bd=d;best=e;}}
    h.target=free||best;if(h.target&&!h.target.blocker)h.target.blocker=h;
  }
  let gx=h.guard.x,gy=h.guard.y;
  if(h.target){const e=h.target;gx=e.x+Math.cos(e.ang)*16;gy=e.y+Math.sin(e.ang)*16;}
  else h.hp=Math.min(max,h.hp+max*.06*dt);
  const dx=gx-h.x,dy=gy-h.y,dd=Math.hypot(dx,dy);
  if(dd>2){const v=Math.min(dd,HERO.spd*dt);h.x+=dx/dd*v;h.y+=dy/dd*v;h.walk+=dt*12;h.mv=.12;if(Math.abs(dx)>1)h.face=dx>0?1:-1;}
  // whirlwind skill
  if(h.skill<=0){const near=S.enemies.filter(e=>!e.dead&&!e.D.flying&&!e.D.naval&&dist(e,h)<HERO.skillR);
    if(near.length){h.skill=HERO.skillCd;h.spin=.5;S.fx.push({k:'whirl',x:h.x,y:h.y,t:0,life:.5,r:HERO.skillR});sfx('whirl');
      for(const e of near)heroHit(h,e,HERO.skillDmg[L]);}}
  if(h.target&&dist(h,h.target)<28){
    if(!h.target.blocker)h.target.blocker=h;
    h.face=h.target.x>h.x?1:-1;
    h.atkCd-=dt;if(h.atkCd<=0){h.atkCd=.8;const[a,b]=HERO.dmg[L];heroHit(h,h.target,rnd(a,b));h.swing=.4;slashFx(h.target.x,h.target.y-8,h.face);sfx('clang');}
  }
}

function updateTornados(dt){
  const h=S.hero,L=h?h.lvl:0,dps=90+L*30;
  for(const tn of S.tornados){
    tn.t+=dt;
    const p=at(tn.d);
    const k=Math.min(1,tn.t/.35); // first glides from the hero onto the road
    tn.x=tn.sx+(p.x-tn.sx)*k;tn.y=tn.sy+(p.y-tn.sy)*k;
    if(k>=1)tn.d-=115*dt;
    for(const e of S.enemies){if(e.dead)continue;if(Math.hypot(e.x-tn.x,e.y-tn.y)<36){
      heroHit(h,e,dps*dt);e.d=Math.max(0,e.d-75*dt);}}
  }
  S.tornados=S.tornados.filter(tn=>tn.t<tn.life&&tn.d>0);
}

  ctx.fillStyle='rgba(40,60,40,.25)';ctx.beginPath();ctx.ellipse(0,4,26,9,0,0,7);ctx.fill();
  for(let i=0;i<8;i++){const y=-i*8,rx=9+i*4,ph=t*14+i*.9,ox=Math.sin(t*5+i*.6)*3;
    ctx.strokeStyle=i%2?'rgba(230,248,255,.9)':'rgba(170,215,230,.85)';ctx.lineWidth=3.2-i*.2;
    ctx.beginPath();ctx.ellipse(ox,y,rx,rx*.32,0,ph%(Math.PI*2),ph%(Math.PI*2)+4.2);ctx.stroke();}
  ctx.fillStyle='rgba(120,90,50,.8)';for(let i=0;i<6;i++){const a=t*9+i*1.05,rr=10+(i%3)*8;ctx.fillRect(Math.cos(a)*rr,-6-i*7+Math.sin(a)*3,2.4,2.4);}
  ctx.fillStyle='rgba(120,200,90,.85)';for(let i=0;i<4;i++){const a=-t*7+i*1.6;ctx.beginPath();ctx.ellipse(Math.cos(a)*(16+i*4),-20-i*8,3,1.6,a,0,7);ctx.fill();}
  ctx.restore();
}

// ---------- damage ----------
function hurt(e,amt,kind){
  if(e.dead)return;
  if(kind==='phys')amt*=1-e.D.armor;else if(kind==='magic')amt*=1-e.D.mres;
  e.hp-=amt;e.flash=.1;
  if(e.hp<=0){e.dead=true;S.gold+=e.D.gold;sfx('death');sfx('coin');floatText(e.x,e.y-14,'+'+e.D.gold,'#ffd76a');
    S.fx.push({k:'die',e:{type:e.type,D:e.D,x:e.x,y:e.y,ang:e.ang,anim:e.anim,atk:0,flash:0},t:0,life:e.D.naval?1.1:.7});
    S.fx.push({k:'poof',x:e.x,y:e.y,t:0,delay:e.D.naval?.6:.4,life:.4,r:e.D.r});updateHud();}
}
function slashFx(x,y,dir,col){S.fx.push({k:'slash',x:x+rnd(-3,3),y:y+rnd(-4,2),dir,a:rnd(-.5,.3),col:col||'#ffffff',t:0,life:.22});}
function floatText(x,y,txt,col){S.fx.push({k:'text',x,y,txt,col,t:0,life:1});}

// ---------- building ----------
function build(spot,type){
  const T=TOWERS[type];if(S.gold<T.cost[0])return;
  S.gold-=T.cost[0];
  const tw={type,T,lvl:0,x:spot.x,y:spot.y,cd:.3,spent:T.cost[0],spot,aim:-Math.PI/2,soldiers:[]};
  if(type==='barracks'){
    const d=nearestD(spot.x,spot.y);const p=at(d);tw.rally={x:p.x,y:p.y};
    for(let i=0;i<3;i++){const s=mkSoldier(tw,i);tw.soldiers.push(s);S.soldiers.push(s);}
  }
  spot.tower=tw;S.towers.push(tw);S.sel=null;updateHud();sfx('build');
}
function mkSoldier(tw,i){
  const a=i*2*Math.PI/3-Math.PI/2;
  return{tw,i,x:tw.x,y:tw.y,home:{x:tw.rally.x+Math.cos(a)*14,y:tw.rally.y+Math.sin(a)*14},hp:tw.T.hp[tw.lvl],dead:false,respawn:0,target:null,atkCd:0,face:1};
}
function upgrade(tw){
  if(tw.lvl>=2)return;const c=tw.T.cost[tw.lvl+1];if(S.gold<c)return;
  S.gold-=c;tw.spent+=c;tw.lvl++;
  if(tw.type==='barracks')for(const s of tw.soldiers){if(!s.dead)s.hp=tw.T.hp[tw.lvl];}
  S.fx.push({k:'ring',x:tw.x,y:tw.y,t:0,life:.5,col:'#ffd76a'});sfx('upgrade');
  S.sel=null;updateHud();
}
function sell(tw){
  S.gold+=Math.floor(tw.spent*.6);sfx('sell');
  for(const s of tw.soldiers){releaseTarget(s);s.gone=true;}
  S.soldiers=S.soldiers.filter(s=>!s.gone);
  S.towers=S.towers.filter(t=>t!==tw);tw.spot.tower=null;
  S.fx.push({k:'poof',x:tw.x,y:tw.y,t:0,life:.5,r:22});
  S.sel=null;updateHud();
}
function releaseTarget(s){if(s.target&&s.target.blocker===s)s.target.blocker=null;s.target=null;}

// ---------- update ----------
function update(dt){
  S.t+=dt;
  while(S.queue.length&&S.queue[0].t<=S.t)spawn(S.queue.shift().type);
  AU.battle=S.queue.length>0||S.enemies.length>0;
  if(S.started&&!S.queue.length&&S.wave<WAVES.length){
    if(S.countdown<0)S.countdown=S.wave===0?-1:25;
    else{S.countdown-=dt;if(S.countdown<=0){S.countdown=-1;startWave();}}
  }
  if(S.meteorCd>0)S.meteorCd=Math.max(0,S.meteorCd-dt);
  if(S.tornadoCd>0)S.tornadoCd=Math.max(0,S.tornadoCd-dt);
  updateTornados(dt);

  // enemies
  for(const e of S.enemies){
    if(e.dead)continue;
    e.anim+=dt*(e.blocker?2.5:8);e.flash=Math.max(0,e.flash-dt);e.atk=Math.max(0,e.atk-dt);
    const b=e.blocker;
    if(b&&(b.dead||b.gone||b.target!==e))e.blocker=null;
    if(e.blocker&&dist(e.blocker,e)<24){
      e.atkCd-=dt;
      if(e.atkCd<=0){e.atkCd=1;const s=e.blocker;e.atk=.5;slashFx(s.x,s.y-6,e.x<s.x?1:-1,'#ffb4a0');s.hp-=e.D.dmg*(1-(s.hero?HERO.armor[s.lvl]:s.tw.T.armor[s.tw.lvl]));if(s.hp<=0)(s.hero?heroDie(s):killSoldier(s));}
    }else{
      e.d+=e.D.spd*dt;
      if(e.d>=e.R.total){e.dead=true;e.escaped=true;S.lives-=e.D.lives;updateHud();
        S.fx.push({k:'hurt',t:0,life:.5});sfx('hurt');
        if(S.lives<=0){S.lives=0;endGame(false);}continue;}
    }
    const p=at(e.d,e.R);
    e.ang=p.ang;
    e.x=p.x-Math.sin(p.ang)*e.off;e.y=p.y+Math.cos(p.ang)*e.off;
  }

  // soldiers
  for(const s of S.soldiers){
    const tw=s.tw,T=tw.T;
    if(s.dead){s.respawn-=dt;if(s.respawn<=0){s.dead=false;s.hp=T.hp[tw.lvl];s.x=tw.x;s.y=tw.y;}continue;}
    if(s.target&&(s.target.dead||dist(s.target,tw.rally)>T.range[tw.lvl]+30))releaseTarget(s);
    if(!s.target){
      let best=null,bd=1e9,free=null,fd=1e9;
      for(const e of S.enemies){if(e.dead||e.D.flying||e.D.naval)continue;const d=dist(e,tw.rally);if(d>T.range[tw.lvl])continue;
        if(!e.blocker&&d<fd){fd=d;free=e;} if(d<bd){bd=d;best=e;}}
      s.target=free||best;
      if(s.target&&!s.target.blocker)s.target.blocker=s;
    }
    let gx,gy;
    if(s.target){const e=s.target;const side=(s.i-1)*8;gx=e.x+Math.cos(e.ang)*14-Math.sin(e.ang)*side;gy=e.y+Math.sin(e.ang)*14+Math.cos(e.ang)*side;}
    else{gx=s.home.x;gy=s.home.y;s.hp=Math.min(T.hp[tw.lvl],s.hp+T.hp[tw.lvl]*.12*dt);}
    const dx=gx-s.x,dy=gy-s.y,dd=Math.hypot(dx,dy);
    if(dd>2){const v=Math.min(dd,90*dt);s.x+=dx/dd*v;s.y+=dy/dd*v;s.walk=(s.walk||0)+dt*13;s.mv=.12;if(Math.abs(dx)>1)s.face=dx>0?1:-1;}
    s.mv=Math.max(0,(s.mv||0)-dt);
    if(s.target&&dist(s,s.target)<26){
      if(!s.target.blocker)s.target.blocker=s;
      s.face=s.target.x>s.x?1:-1;
      s.atkCd-=dt;if(s.atkCd<=0){s.atkCd=1;const[a,b]=T.dmg[tw.lvl];hurt(s.target,rnd(a,b),'phys');s.swing=.36;slashFx(s.target.x,s.target.y-6,s.face);sfx('clang');}
    }
    if(s.swing)s.swing=Math.max(0,s.swing-dt);
  }

  updateHero(dt);

  // towers
  for(const tw of S.towers){
    if(tw.type==='barracks')continue;
    const T=tw.T;tw.cd-=dt;
    let tgt=null,bd=-1;
    for(const e of S.enemies){if(e.dead)continue;if(e.D.flying&&!T.air)continue;if(dist(e,tw)>T.range[tw.lvl])continue;if(e.d>bd){bd=e.d;tgt=e;}}
    if(tgt)tw.aim=Math.atan2(tgt.y-tw.y,tgt.x-tw.x);
    if(tgt&&tw.cd<=0){
      tw.cd=T.rate[tw.lvl];const[a,b]=T.dmg[tw.lvl];const dmg=rnd(a,b);
      if(tw.type==='archer'){tw.shot=.3;S.proj.push({k:'arrow',x:tw.x,y:tw.y-36-tw.lvl*4,tgt,tx:tgt.x,ty:tgt.y,spd:520,dmg,kind:'phys'});sfx('arrow');}
      else if(tw.type==='mage'){tw.shot=.35;S.proj.push({k:'bolt',x:tw.x,y:tw.y-12,tgt,tx:tgt.x,ty:tgt.y,spd:340,dmg,kind:'magic'});sfx('magic');}
      else{
        const ft=1;const p=at(tgt.d+(tgt.blocker?0:tgt.D.spd*ft),tgt.R);
        S.proj.push({k:'shell',sx:tw.x+Math.cos(tw.aim)*18,sy:tw.y-13+Math.sin(tw.aim)*18,ex:p.x,ey:p.y,t:0,life:ft,dmg,splash:T.splash[tw.lvl],x:tw.x,y:tw.y});
        tw.recoil=.2;sfx('cannon');
      }
    }
    if(tw.recoil)tw.recoil=Math.max(0,tw.recoil-dt);
    if(tw.shot)tw.shot=Math.max(0,tw.shot-dt);
  }

  // projectiles
  for(const p of S.proj){
    if(p.k==='shell'){
      p.t+=dt;const u=Math.min(1,p.t/p.life);
      p.x=p.sx+(p.ex-p.sx)*u;p.y=p.sy+(p.ey-p.sy)*u-Math.sin(u*Math.PI)*90;
      if(u>=1){p.done=true;boom(p.ex,p.ey,p.splash,p.dmg,'phys');}
      continue;
    }
    if(p.tgt&&!p.tgt.dead){p.tx=p.tgt.x;p.ty=p.tgt.y-4;}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),v=p.spd*dt;
    p.ang=Math.atan2(dy,dx);
    if(d<=v+2){p.done=true;if(p.tgt&&!p.tgt.dead)hurt(p.tgt,p.dmg,p.kind);
      if(p.k==='bolt'){S.fx.push({k:'spark',x:p.tx,y:p.ty,t:0,life:.3});sfx('magicHit');}}
    else{p.x+=dx/d*v;p.y+=dy/d*v;}
  }
  S.proj=S.proj.filter(p=>!p.done);

  // effects
  for(const f of S.fx){f.t+=dt;
    if(f.k==='meteor'&&!f.hit&&f.t>=f.delay+.45){f.hit=true;boom(f.x,f.y,48,rnd(45,65),'true',true);}
  }
  S.fx=S.fx.filter(f=>f.t<(f.delay||0)+f.life);

  for(const e of S.enemies)if(e.dead&&e.blocker){e.blocker=null;}
  S.enemies=S.enemies.filter(e=>!e.dead);

  if(S.started&&S.wave>=WAVES.length&&!S.queue.length&&!S.enemies.length&&!S.over)endGame(true);
}
function killSoldier(s){s.dead=true;s.respawn=s.tw.T.respawn;releaseTarget(s);S.fx.push({k:'poof',x:s.x,y:s.y,t:0,life:.4,r:7});}
function boom(x,y,r,dmg,kind,fire){
  S.fx.push({k:'boom',x,y,r,t:0,life:.45,fire});sfx('boom',fire?1.4:1);
  for(const e of S.enemies){if(e.dead||e.D.flying)continue;if(Math.hypot(e.x-x,e.y-y)<=r+e.D.r)hurt(e,dmg,kind);}
}
function castMeteor(x,y){
  if(S.meteorCd>0)return;S.meteorCd=METEOR_CD;S.targeting=false;sfx('whoosh');
  for(let i=0;i<5;i++){const a=rnd(0,Math.PI*2),r=i?rnd(10,45):0;S.fx.push({k:'meteor',x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,t:0,delay:i*.18,life:.75});}
  updateHud();
}
function endGame(win){
  S.over=true;AU.battle=false;sfx(win?'win':'lose');
  $('endTitle').textContent=win?'王城守住了':'防線失守';
  $('endText').textContent=win?`${LEVEL.name}：十波敵軍全數擊退，剩餘生命 ${S.lives}。`+(LV<LEVELS.length-1?'下一關是海上的怒海，海盜船會走水路衝進港口！':''):`在第 ${S.wave} 波被突破。調整塔的配置再試一次。`;
  $('btnNext').hidden=!(win&&LV<LEVELS.length-1);
  $('ovEnd').hidden=false;
}

function drawProj(p){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.k==='arrow'){ctx.rotate(p.ang||0);ctx.strokeStyle='#3a2512';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(6,0);ctx.stroke();ctx.fillStyle='#ccc';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(4,-3);ctx.lineTo(4,3);ctx.fill();}
  else if(p.k==='bolt'){ctx.fillStyle='rgba(160,120,255,.35)';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.fillStyle='#e0d4ff';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();}
  else{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();}
  ctx.restore();
}
function drawFx(f){
  const u=Math.max(0,(f.t-(f.delay||0))/f.life);if(f.t<(f.delay||0))return;
  ctx.save();
  if(f.k==='text'){ctx.globalAlpha=1-u;ctx.font='700 14px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(f.txt,f.x+1,f.y-u*24+1);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-u*24);}
  else if(f.k==='poof'){ctx.globalAlpha=1-u;ctx.fillStyle='#ddd';for(let i=0;i<5;i++){const a=i*1.26;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*u*f.r*1.5,f.y+Math.sin(a)*u*f.r*1.5,f.r*.4*(1-u)+1,0,7);ctx.fill();}}
  else if(f.k==='boom'){ctx.globalAlpha=1-u;ctx.fillStyle=f.fire?'#ff7a2a':'#ffb04a';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.4+.6*u),0,7);ctx.fill();ctx.fillStyle='#fff1b0';ctx.beginPath();ctx.arc(f.x,f.y,f.r*.4*(1-u),0,7);ctx.fill();ctx.strokeStyle='rgba(60,40,20,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*u,0,7);ctx.stroke();}
  else if(f.k==='spark'){ctx.globalAlpha=1-u;ctx.strokeStyle='#c8b4ff';ctx.lineWidth=2;for(let i=0;i<6;i++){const a=i*1.05;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*4,f.y+Math.sin(a)*4);ctx.lineTo(f.x+Math.cos(a)*(6+u*10),f.y+Math.sin(a)*(6+u*10));ctx.stroke();}}
  else if(f.k==='ring'){ctx.globalAlpha=1-u;ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,f.y,20+u*30,10+u*15,0,0,7);ctx.stroke();}
  else if(f.k==='meteor'){
    const fall=Math.min(1,u/.6);
    if(fall<1){const mx=f.x-160*(1-fall),my=f.y-300*(1-fall);
      ctx.strokeStyle='rgba(255,160,60,.6)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(mx-40,my-75);ctx.lineTo(mx,my);ctx.stroke();
      ctx.fillStyle='#ff6a2a';ctx.beginPath();ctx.arc(mx,my,9,0,7);ctx.fill();ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(mx,my,4,0,7);ctx.fill();
      ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(f.x,f.y,10*fall,5*fall,0,0,7);ctx.fill();}
  }
  else if(f.k==='mark'){ctx.globalAlpha=1-u;ctx.strokeStyle='#9fe8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(f.x,f.y,6+u*14,3+u*7,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(f.x,f.y-14+u*6);ctx.lineTo(f.x,f.y-2);ctx.stroke();}
  else if(f.k==='whirl'){ctx.globalAlpha=.8*(1-u);ctx.strokeStyle='#e9f6ff';ctx.lineWidth=5;for(let i=0;i<3;i++){const a=u*9+i*2.1;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.5+.5*u),a,a+1.2);ctx.stroke();}ctx.fillStyle='rgba(159,232,255,.18)';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.5+.5*u),0,7);ctx.fill();}
  else if(f.k==='slash'){ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.rotate(f.a);ctx.globalAlpha=1-u;
    const a0=-1.6,a1=a0+2.6*Math.min(1,u*2.5);ctx.strokeStyle=f.col;ctx.lineCap='round';ctx.lineWidth=4*(1-u)+1;
    ctx.beginPath();ctx.arc(-6,0,14,a0,a1);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(-6,0,14,a0,a1);ctx.stroke();}
  else if(f.k==='die'){const e=f.e,D=e.D,r=D.r,s=r/10,flip=Math.cos(e.ang)<-.1?-1:1;
    ctx.translate(e.x,e.y);ctx.globalAlpha=Math.max(0,1-Math.max(0,u-.45)/.55);ctx.lineJoin='round';
    if(D.naval){ctx.beginPath();ctx.rect(-60,-80,120,86);ctx.clip();ctx.translate(0,u*34);ctx.scale(flip,1);ctx.rotate(u*.45);}
    else if(D.flying){ctx.translate(0,-24+u*u*30);ctx.scale(flip,1);ctx.rotate(u*3);}
    else{const k=Math.min(1,u*2.4);ctx.translate(0,-r*.5);ctx.scale(flip,1);ctx.translate(0,10*s);ctx.rotate(-k*k*1.45);ctx.translate(0,-10*s);}
    SPRITE[e.type](e,s,0);}
  else if(f.k==='hurt'){ctx.globalAlpha=.35*(1-u);ctx.fillStyle='#c4472f';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
function rangeCircle(x,y,r,col){ctx.save();ctx.fillStyle=col+'22';ctx.strokeStyle=col+'cc';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();ctx.restore();}

// ---------- menus ----------
function menuCenter(x,y){return{x:Math.max(62,Math.min(W-62,x)),y:Math.max(108,Math.min(H-70,y))};}
function menuButtons(){
  const sel=S.sel;if(!sel)return[];
  if(sel.kind==='spot'){
    const c=menuCenter(sel.spot.x,sel.spot.y);
    const ang=[-2.36,-.785,2.36,.785];
    return BUILD_ORDER.map((type,i)=>({act:'build',type,x:c.x+Math.cos(ang[i])*52,y:c.y+Math.sin(ang[i])*50,cost:TOWERS[type].cost[0]}));
  }
  const tw=sel.tower,c=menuCenter(tw.x,tw.y-14);
  const b=[{act:'sell',x:c.x,y:c.y+52,cost:-Math.floor(tw.spent*.6)}];
  b.push({act:'up',x:c.x,y:c.y-56,cost:tw.lvl<2?tw.T.cost[tw.lvl+1]:null});
  return b;
}
function drawMenu(){
  const sel=S.sel;if(!sel)return;
  const btns=menuButtons();
  if(sel.kind==='tower'){
    const tw=sel.tower;rangeCircle(tw.x,tw.y,tw.T.range[tw.lvl],tw.type==='barracks'?'#7ab8ff':'#ffffff');
    if(tw.type==='barracks'){ctx.fillStyle='#ffd76a';ctx.beginPath();ctx.arc(tw.rally.x,tw.rally.y,4,0,7);ctx.fill();}
    const hb=S.hover&&S.hover.act==='up'&&tw.lvl<2;
    if(hb)rangeCircle(tw.x,tw.y,tw.T.range[tw.lvl+1],'#ffd76a');
  }
  if(sel.kind==='spot'&&S.hover&&S.hover.act==='build'){const T=TOWERS[S.hover.type];rangeCircle(sel.spot.x,sel.spot.y,T.range[0],'#ffffff');}
  const ref=sel.kind==='spot'?sel.spot:sel.tower;
  const c=sel.kind==='spot'?menuCenter(ref.x,ref.y):menuCenter(ref.x,ref.y-14);
  ctx.strokeStyle='rgba(255,230,170,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,sel.kind==='spot'?52:54,0,7);ctx.stroke();
  for(const b of btns){
    const afford=b.cost==null||b.cost<=0||S.gold>=b.cost;
    const hov=S.hover===b||(S.hover&&S.hover.act===b.act&&S.hover.type===b.type);
    ctx.save();
    ctx.fillStyle=hov?'#fff4da':'#f1e2c0';ctx.strokeStyle=afford?'#8a6634':'#555';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(b.x,b.y,22,0,7);ctx.fill();ctx.stroke();
    ctx.globalAlpha=afford?1:.4;
    if(b.act==='build'){drawTower({type:b.type,x:b.x,y:b.y+10,lvl:0,aim:-1.2},.5,true);}
    else if(b.act==='up'){ctx.fillStyle=b.cost==null?'#999':'#2f7d2e';ctx.beginPath();ctx.moveTo(b.x,b.y-12);ctx.lineTo(b.x+11,b.y+1);ctx.lineTo(b.x+4,b.y+1);ctx.lineTo(b.x+4,b.y+10);ctx.lineTo(b.x-4,b.y+10);ctx.lineTo(b.x-4,b.y+1);ctx.lineTo(b.x-11,b.y+1);ctx.fill();}
    else{ctx.fillStyle='#b8402c';ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',b.x,b.y+1);}
    ctx.globalAlpha=1;
    const label=b.cost==null?'最高級':b.cost<0?'+'+(-b.cost):String(b.cost);
    ctx.font='700 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const tw2=ctx.measureText(label).width+10;
    ctx.fillStyle='rgba(30,20,12,.9)';ctx.fillRect(b.x-tw2/2,b.y+17,tw2,16);
    ctx.fillStyle=b.cost!=null&&b.cost>0&&!afford?'#ff8a72':'#ffd76a';ctx.fillText(label,b.x,b.y+25.5);
    ctx.restore();
  }
}

// ---------- render ----------
function render(){
  ctx.drawImage(bg,0,0);
  for(const s of S.spots)if(!s.tower)drawSpot(s);
  const items=[];
  for(const tw of S.towers)items.push({y:tw.y,f:()=>drawTower(tw)});
  for(const e of S.enemies)if(!e.D.flying)items.push({y:e.y,f:()=>drawEnemy(e)});
  for(const s of S.soldiers)items.push({y:s.y,f:()=>drawSoldier(s)});
  if(S.hero)items.push({y:S.hero.y,f:drawHero});
  items.sort((a,b)=>a.y-b.y);for(const it of items)it.f();
  for(const e of S.enemies)if(e.D.flying)drawEnemy(e);
  for(const tn of S.tornados)drawTornado(tn);
  for(const p of S.proj)drawProj(p);
  for(const f of S.fx)drawFx(f);
  if(S.targeting&&S.mx>=0){rangeCircle(S.mx,S.my,48,'#ff7a2a');}
  drawMenu();
  if(!S.started||S.countdown>0){const pulse=.5+.5*Math.sin(performance.now()/200);ctx.save();ctx.fillStyle=`rgba(224,96,63,${.5+pulse*.5})`;for(const R of ROUTES){const y=R.pts[0][1];ctx.beginPath();ctx.moveTo(14,y-12);ctx.lineTo(34,y);ctx.lineTo(14,y+12);ctx.fill();}ctx.restore();}
  if(S.paused&&!S.over){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f6ecd6';ctx.font='900 40px "Noto Serif TC",serif';ctx.textAlign='center';ctx.fillText('暫停',W/2,H/2);}
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(!S.paused&&!S.over&&$('ovStart').hidden){const n=S.speed;for(let i=0;i<n;i++)update(dt);}
  render();updateDyn();
  requestAnimationFrame(frame);
}

// ---------- HUD ----------
function updateHud(){
  $('sLives').textContent=S.lives;$('sGold').textContent=S.gold;$('sWave').textContent=`${S.wave}/${WAVES.length}`;
}
function updateDyn(){
  const wb=$('btnWave');wb.classList.toggle('pulse',!S.started||S.countdown>0);
  const canCall=S.wave<WAVES.length&&!S.queue.length&&(!S.started||S.countdown>0);
  wb.disabled=!canCall;
  let wl=S.wave>=WAVES.length?'最後一波':canCall&&S.countdown>0?`+${Math.ceil(S.countdown)} 金`:!S.started?'開戰':`第 ${S.wave} 波`;
  const wle=$('waveLbl');if(wle.textContent!==wl)wle.textContent=wl;
  const mb=$('btnMeteor');mb.disabled=S.meteorCd>0;mb.classList.toggle('on',S.targeting);
  $('meteorCd').style.height=(S.meteorCd/METEOR_CD*100)+'%';
  const ml=S.meteorCd>0?`${Math.ceil(S.meteorCd)}`:'火雨';if($('meteorLbl').textContent!==ml)$('meteorLbl').textContent=ml;
  $('sGold').textContent=S.gold;
  const H=S.hero,hb=$('btnHero');const hl=H.dead?`${Math.ceil(H.respawn)}`:`${H.lvl+1}`;
  if($('heroLbl').textContent!==hl)$('heroLbl').textContent=hl;hb.disabled=H.dead;hb.classList.toggle('on',S.heroSel);
  $('heroHp').style.width=(H.dead?0:H.hp/HERO.hp[H.lvl]*100)+'%';
  const tb=$('btnTornado');tb.disabled=H.dead||S.tornadoCd>0;$('tornadoCd').style.height=(S.tornadoCd/TORNADO_CD*100)+'%';
  const tl=S.tornadoCd>0?`${Math.ceil(S.tornadoCd)}`:'旋風';if($('tornadoLbl').textContent!==tl)$('tornadoLbl').textContent=tl;
}
function setTip(html){const t=$('tip');if(t.innerHTML!==html)t.innerHTML=html;t.hidden=!html;
  const ref=S.heroSel?S.hero:S.sel?(S.sel.spot||S.sel.tower):S.hover&&S.hover.e?S.hover.e:(S.mx>=0?{y:S.my}:null);
  t.classList.toggle('low',!!ref&&ref.y<H*.45);}
function describeTower(type,lvl){
  const T=TOWERS[type];
  if(type==='barracks')return `士兵生命 ${T.hp[lvl]}・傷害 ${T.dmg[lvl][0]}–${T.dmg[lvl][1]}・護甲 ${Math.round(T.armor[lvl]*100)}%`;
  return `傷害 ${T.dmg[lvl][0]}–${T.dmg[lvl][1]}${T.kind==='magic'?'（魔法）':''}・射程 ${T.range[lvl]}・每 ${T.rate[lvl]} 秒${T.splash?'・爆炸半徑 '+T.splash[lvl]:''}`;
}
function refreshTip(){
  const h=S.hover;
  if(S.heroSel){const H=S.hero;return setTip(`<b>${HERO.name}</b> Lv${H.lvl+1}　生命 ${Math.ceil(H.hp)}/${HERO.hp[H.lvl]}・傷害 ${HERO.dmg[H.lvl][0]}–${HERO.dmg[H.lvl][1]}・護甲 ${Math.round(HERO.armor[H.lvl]*100)}%<br>點擊地圖任一處讓英雄移動過去。按左下「旋風」放出沿路前進的旋風。被動「旋風斬」每 ${HERO.skillCd} 秒自動施放，傷害 ${HERO.skillDmg[H.lvl]}。`);}
  if(S.targeting)return setTip('<b>火雨</b>：點擊地圖選擇落點，5 顆隕石對地面敵人造成範圍傷害。按 Esc 取消。');
  if(h&&h.act==='build'){const T=TOWERS[h.type];return setTip(`<b>${T.name}</b>（${T.cost[0]} 金）${T.desc}<br>${describeTower(h.type,0)}`);}
  if(S.sel&&S.sel.kind==='tower'){const tw=S.sel.tower;
    let s=`<b>${tw.T.name} ${['I','II','III'][tw.lvl]}</b>　${describeTower(tw.type,tw.lvl)}`;
    if(tw.lvl<2)s+=`<br>升級（${tw.T.cost[tw.lvl+1]} 金）：${describeTower(tw.type,tw.lvl+1)}`;else s+='<br>已達最高等級。';
    s+=`　出售可回收 ${Math.floor(tw.spent*.6)} 金。`;return setTip(s);}
  if(h&&h.kind==='enemy'){const D=h.e.D;return setTip(`<b>${D.name}</b>　生命 ${Math.ceil(h.e.hp)}/${h.e.maxHp}・護甲 ${Math.round(D.armor*100)}%・魔抗 ${Math.round(D.mres*100)}%${D.flying?'・飛行':''}${D.naval?'・水路（兵營擋不住）':''}・擊殺 ${D.gold} 金${D.lives>1?'・漏掉扣 '+D.lives+' 命':''}`);}
  if(S.sel&&S.sel.kind==='spot')return setTip('選擇要建造的塔。滑過圖示可以看數值。');
  setTip(S.started?'':(innerHeight>innerWidth&&!isFs()?'手機請橫放，或按「全螢幕」放大。':'先在道路旁的石台建幾座塔，準備好後按上方「開戰」。'));
}
setInterval(refreshTip,150);

// ---------- input ----------
function toLogical(ev){const r=cv.getBoundingClientRect(),w=cv.clientWidth,h=cv.clientHeight;
  if(game.classList.contains('rot')){const dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2);return{x:(dy+w/2)/w*W,y:(-dx+h/2)/h*H};}
  return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
function hitMenu(x,y){for(const b of menuButtons())if(Math.hypot(b.x-x,b.y-y)<24)return b;return null;}
cv.addEventListener('pointermove',ev=>{
  const p=toLogical(ev);S.mx=p.x;S.my=p.y;
  let h=hitMenu(p.x,p.y);
  if(!h){for(const e of S.enemies){const fy=e.D.flying?-24:-e.D.r*.8;if(Math.hypot(e.x-p.x,e.y+fy-p.y)<e.D.r+8){h={kind:'enemy',e};break;}}}
  S.hover=h;
  cv.style.cursor=h&&h.act||S.targeting?'pointer':(S.spots.some(s=>Math.hypot(s.x-p.x,s.y-p.y)<28)?'pointer':'default');
});
cv.addEventListener('pointerleave',()=>{S.mx=-1;S.hover=null;});
cv.addEventListener('pointerdown',ev=>{
  if(S.over)return;
  const p=toLogical(ev);
  if(S.targeting){castMeteor(p.x,p.y);return;}
  const H=S.hero;
  if(H&&!H.dead&&Math.hypot(H.x-p.x,H.y-6-p.y)<26){S.heroSel=!S.heroSel;S.sel=null;sfx('click');return;}
  if(S.heroSel){heroCommand(p.x,p.y);return;}
  const b=hitMenu(p.x,p.y);
  if(b){
    if(b.act==='build')build(S.sel.spot,b.type);
    else if(b.act==='up')upgrade(S.sel.tower);
    else if(b.act==='sell')sell(S.sel.tower);
    S.hover=null;return;
  }
  const tw=S.towers.find(t=>Math.hypot(t.x-p.x,t.y-12-p.y)<30);
  if(tw){S.sel={kind:'tower',tower:tw};return;}
  const sp=S.spots.find(s=>!s.tower&&Math.hypot(s.x-p.x,s.y-p.y)<30);
  if(sp){S.sel={kind:'spot',spot:sp};return;}
  S.sel=null;
});
addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){S.targeting=false;S.sel=null;S.heroSel=false;}
  if(ev.key===' '&&$('ovStart').hidden&&!S.over){ev.preventDefault();togglePause();}
});
function togglePause(){S.paused=!S.paused;$('btnPause').classList.toggle('on',S.paused);$('btnPause').title=S.paused?'繼續':'暫停';}
$('btnWave').onclick=()=>{auInit();$('ovStart').hidden=true;startWave();};
$('btnMeteor').onclick=()=>{if(S.meteorCd<=0){S.targeting=!S.targeting;S.sel=null;S.heroSel=false;}};
$('btnSpeed').onclick=()=>{S.speed=S.speed===1?2:1;$('btnSpeed').textContent=S.speed+'×';$('btnSpeed').classList.toggle('on',S.speed>1);};
$('btnPause').onclick=togglePause;
$('btnTornado').onclick=()=>{auInit();castTornado();};
$('btnHero').onclick=()=>{if(S.hero.dead)return;S.heroSel=!S.heroSel;S.sel=null;S.targeting=false;sfx('click');};
$('btnStart').onclick=()=>{auInit();sfx('click');$('ovStart').hidden=true;};
function soundLabel(){$('btnSound').classList.toggle('off',!AU.on);}
$('btnSound').onclick=()=>{auInit();setSound(!AU.on);soundLabel();sfx('click');};soundLabel();
addEventListener('pointerdown',auInit,{capture:true});
function chooseLevel(i){setLevel(i);reset();document.querySelectorAll('.lvb').forEach(b=>b.classList.toggle('on',+b.dataset.lv===i));}
document.querySelectorAll('.lvb').forEach(b=>b.onclick=()=>{sfx('click');chooseLevel(+b.dataset.lv);});
$('btnNext').onclick=()=>{chooseLevel(LV+1);$('ovEnd').hidden=true;if(S.paused)togglePause();sfx('horn');};
$('btnRestart').onclick=()=>{reset();$('ovEnd').hidden=true;if(S.paused)togglePause();S.speed=1;$('btnSpeed').textContent='1×';$('btnSpeed').classList.remove('on');};

// ---------- sizing & fullscreen ----------
const game=$('game');
function isFs(){return game.classList.contains('fs');}
function fit(){
  const fs=isFs(),rot=fs&&innerHeight>innerWidth*1.05;game.classList.toggle('rot',rot);
  let aw=fs?innerWidth:document.body.clientWidth-16, ah=fs?innerHeight:innerHeight-16;
  if(fs){const cs=getComputedStyle($('safe')),px=k=>parseFloat(cs[k])||0;
    aw-=px('paddingLeft')+px('paddingRight');ah-=px('paddingTop')+px('paddingBottom');}
  if(rot)[aw,ah]=[ah,aw];
  const w=Math.max(200,Math.min(aw,ah*1.6));
  game.style.width=w+'px';game.style.height=(w/1.6)+'px';
  game.style.setProperty('--u',(w/960).toFixed(3));
}
function resize(){
  const dpr=Math.min(matchMedia('(pointer:coarse)').matches?1.5:2,devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(cv.clientWidth*dpr));cv.height=Math.max(1,Math.round(cv.clientHeight*dpr));
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
function setFs(on){
  game.classList.toggle('fs',on);$('fsbg').hidden=!on;$('btnFs').classList.toggle('on',on);$('btnFs').title=on?'離開全螢幕':'全螢幕';
  const de=document.documentElement;
  if(on&&!document.fullscreenElement){const req=de.requestFullscreen||de.webkitRequestFullscreen;
    if(req){try{const pr=req.call(de);if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}}
    else if(!standalone)toast('iPhone 的瀏覽器不支援真正的全螢幕。想要沒有網址列：按 Safari 的分享鈕 →「加入主畫面」，之後從桌面圖示打開就是全螢幕。');
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}
  if(!on&&document.fullscreenElement){try{document.exitFullscreen().catch(()=>{});}catch(e){}}
  fit();
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&isFs())setFs(false);else fit();});
$('btnFs').onclick=()=>setFs(!isFs());
const standalone=!!(navigator.standalone||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
let toastT=0;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},6000);}
$('toast').onclick=()=>{$('toast').hidden=true;};
if(standalone)setTimeout(()=>setFs(true),0);
$('btnStartFs').onclick=()=>{setFs(true);$('btnStart').click();};
addEventListener('resize',fit);
new ResizeObserver(()=>{resize();}).observe(cv);
fit();

setLevel(0);reset();resize();requestAnimationFrame(frame);
})();
</script>
</html>
